<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>План на неделю</title>
<style>
:root{
  --bg:#ffffff;--ink:#14161a;--muted:#626a76;--line:#e4e7ec;--soft:#f7f8fa;
  --gym:#2459d6;--gym-bg:#eaf0fe;--rest:#178a55;--rest-bg:#e6f5ed;
  --food:#b45f0c;--food-bg:#fdf3e6;--pill:#6d36c4;--pill-bg:#f2ecfc;--warn:#b42318;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header h1{font-size:21px;margin:2px 0}
header p{margin:0;color:var(--muted);font-size:13px}

.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0 8px}
.tabs button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 2px;font:700 15px system-ui;cursor:pointer}
.tabs button small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.tabs button.g small{color:var(--gym)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button.on small{color:#d6d9df}
.tools{display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px}
.tools button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}

.day{display:none}.day.on{display:block}
.dayhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin:6px 0 14px}
.dayhead h2{margin:0;font-size:26px}
.badge{padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700}
.badge.gym{background:var(--gym-bg);color:var(--gym)}
.badge.rest{background:var(--rest-bg);color:var(--rest)}

.sec{margin:0 0 18px}
.sec h3{display:flex;align-items:center;gap:8px;font-size:16px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.sec h3 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;font-size:12px}

/* 1. распорядок */
.tl{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl div{display:grid;grid-template-columns:58px 26px 1fr 22px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}
.tl div:first-child{border-top:0}
.tl b{font-variant-numeric:tabular-nums}
.tl i{font-style:normal;text-align:center}
.tl .k{width:16px;height:16px;border:1.5px solid #b9bfc8;border-radius:4px;justify-self:end}
.tl .gymrow{background:var(--gym-bg);font-weight:700}
.tl .walkrow{background:var(--rest-bg);font-weight:700}
.tl .msgrow{background:#fff6d9;font-weight:700}
.msgs{display:grid;gap:8px}
.msg{border:1px solid #f0dfa8;background:#fffbea;border-radius:12px;padding:10px 12px}
.msg .h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.msg .h b{font-size:14px}
.msg .h em{font-style:normal;font-size:13px;color:var(--food);font-weight:700}
.msg pre{margin:0;white-space:pre-wrap;font:14px/1.5 ui-monospace,Consolas,monospace;color:var(--ink)}
.msg button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer}
.msg .note{font-size:12px;color:var(--muted);margin-top:4px}
@media print{.msg button{display:none}}

/* 2. еда */
.meals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.meal{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.meal .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.meal .h span{font-weight:700}
.meal .h em{font-style:normal;font-size:13px;color:var(--food);font-weight:700}
.meal ul{margin:0;padding-left:18px}
.meal li{margin:2px 0}
.meal.opt{background:var(--soft)}

/* 3. добавки */
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;border-top:0;background:var(--soft)}
td.tm{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;width:110px}
td.tm small{display:block;font-weight:500;color:var(--muted)}
.pill{color:var(--pill);font-weight:600}

/* 4. тренировка */
.phase{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.phase div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.phase b{display:block;font-size:12px;color:var(--gym)}
.warm{font-size:13px;color:var(--muted);margin:0 0 8px}
td.no{width:28px;color:var(--muted);font-weight:700}
td.s{white-space:nowrap;font-variant-numeric:tabular-nums}
td.wt{width:90px}
td.wt span{display:block;border-bottom:1px solid #c9ced6;height:18px}
.tips{font-size:13px;color:var(--muted);margin:8px 0 0}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft);font-size:14px}

.rules{display:flex;flex-wrap:wrap;gap:6px}
.rules span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:#fff}
details.wplan{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0 14px}details.wplan summary{font-weight:700;cursor:pointer}details.wplan h4{margin:14px 0 6px}.cur td{background:#eaf0fe;font-weight:700}.scroll{overflow-x:auto}.scroll table{min-width:620px}
.foot{margin:16px 0 4px;font-size:12px;color:var(--muted)}
.warn{color:var(--warn);font-weight:700}

@media (max-width:600px){
  .tabs{gap:4px}.tabs button{font-size:14px;padding:7px 0}.tabs button small{font-size:10px}
  .meals{grid-template-columns:1fr}
  .phase{grid-template-columns:1fr}
  .tl div{grid-template-columns:50px 24px 1fr 20px;padding:7px 8px}
  th,td{padding:7px 6px}td.tm{width:auto}td.wt{display:none}th.wt{display:none}
  td.s{white-space:normal}
}
@media print{
  @page{size:A4;margin:10mm}
  body{font-size:11px}
  .tabs,.tools,header,details.wplan{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0 14px}details.wplan summary{font-weight:700;cursor:pointer}details.wplan h4{margin:14px 0 6px}.cur td{background:#eaf0fe;font-weight:700}.scroll{overflow-x:auto}.scroll table{min-width:620px}
.foot{display:none}
  .wrap{max-width:none;padding:0}
  .day{display:block;break-after:page;page-break-after:always}
  .day:last-child{break-after:auto;page-break-after:auto}
  .dayhead h2{font-size:20px}.dayhead{margin-bottom:8px}
  .sec{margin-bottom:9px;break-inside:avoid}
  .sec h3{font-size:12px;margin-bottom:4px}
  .tl div{padding:3px 8px}
  .meal{padding:6px 8px}.meals{gap:6px}
  th,td{padding:4px 6px}table{font-size:11px}
  .phase div{padding:4px 6px;font-size:10px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>План на неделю: зал · кето · добавки</h1>
  <p>Старт 12.10.2026 · зал Пн / Ср / Пт в 18:30 · ~2 200 ккал · белок 170–190 г · углеводы до 25 г</p>
</header>
<div class="tabs" id="tabs"></div>
<div class="tools">
  <button onclick="printOne()">🖨 Печать этого дня</button>

</div>
<details class="wplan"><summary>📅 План по неделям: 12.10 – 06.12 и дальше</summary>
<div id="wplan"></div></details>
<div id="days"></div>
<p class="foot"><span class="warn">Стоп и к врачу:</span> боль или давление за грудиной, одышка не по нагрузке, головокружение, острая боль в суставе или пояснице.</p>
</div>

<script>
const DAYS = [

const W = {
 "А":[["Присед со штангой","4 × 5–6","3 мин","60 кг"],["Жим штанги лёжа","4 × 5–6","3 мин","60 кг"],["Тяга штанги в наклоне","3 × 8–10","2 мин","50 кг"],["Жим гантелей сидя вверх","3 × 8–10","90 с","2 × 16 кг"],["Подъём коленей в висе (турник или брусья)","3 × 10–12","60 с","свой вес"],["Кардио: дорожка в гору, наклон 6–10 %, 4,5–5,5 км/ч","20–25 мин","пульс 120–135","—"]],

};
const WEEKS=[["12.10–18.10","Втягивание: 2–3 подхода, запас 3"],["19.10–25.10","Рост силы: все подходы, запас 1–2"],["26.10–01.11","Рост силы"],["02.11–08.11","Рост силы"],["09.11–15.11","Рост силы"],["16.11–22.11","Рост силы"],["23.11–29.11","Пиковая: запас 1"],["30.11–06.12","Разгрузка: 2 подхода"]];

const WK=(()=>{const s=new Date(2026,9,12),n=Math.floor((new Date()-s)/864e5/7)+1;return Math.min(8,Math.max(1,n));})();
function schedule(d){
  const g=!!d.gym, r=[
    ["08:00","⚖️","Подъём → туалет → взвеситься натощак"],
    ["08:05","💧","Вода 400 мл + щепотка соли · таблетка от рефлюкса"],

function meal(title,time,items,opt){
  return `<div class="meal${opt?" opt":""}"><div class="h"><span>${title}</span><em>${time}</em></div><ul>${items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
}

const tabs=document.getElementById("tabs"), box=document.getElementById("days");
DAYS.forEach((d,i)=>{
  const g=!!d.gym; let n=0; const N=()=>`<span class="n">${++n}</span>`;

  </div></div>

  <div class="sec"><h3>${N()} Добавки</h3><table><tr><th>Когда</th><th>Что выпить</th></tr>
    ${supps(g).map(r=>`<tr><td class="tm">${r[0]}<small>${r[1]}</small></td><td>${r[2]}</td></tr>`).join("")}
  </table></div>`;

  if(g) h+=`<div class="sec"><h3>${N()} Тренировка ${d.gym}</h3>
    <div class="phase">
      <div><b>12.10 – 18.10 · втягивание</b>2–3 подхода, 3 повтора в запасе. Веса ~60–70 % от «кажется рабочим»</div>
      <div><b>19.10 – 29.11 · рост силы</b>Все подходы, 1–2 повтора в запасе. Пока штанга идёт быстро — +2,5–5 кг каждую неделю на базе</div>
      <div><b>30.11 – 06.12</b>Разгрузка: 2 подхода, веса −10 %</div>
    </div>
    <p class="warm"><b>Разминка 8–10 мин:</b> 5 мин эллипс или велосипед → стоя: махи ногами, вращения плеч и таза, 10 приседаний без веса → 1–2 лёгких подхода первого упражнения. Коврик и место на полу не нужны.</p>
    <table><tr><th>#</th><th>Упражнение</th><th>Подходы × повторы</th><th>Отдых</th><th>Неделя ${WK} · ${WEEKS[WK-1][0]}</th></tr>
    ${W[d.gym].map((e,j)=>`<tr><td class="no">${j+1}</td><td>${e[0]}</td><td class="s">${e[1]}</td><td class="s">${e[2]}</td><td class="s"><b>${kg(P[d.gym][j][WK-1])}</b></td></tr>`).join("")}
    </table>
    <div class="box" style="margin-top:8px;background:#fff1f0;border-color:#f3c5c0"><b>⚠️ Стартовый вес — потолок первой недели, не цель.</b> Перед каждым упражнением 1–2 разминочных подхода (пустой гриф / лёгкие гантели). Сделал первый рабочий подход и запас меньше 3 повторов → сразу снизь вес на 10–20 %. Хрустит или тянет в суставе — снизь вес или пропусти упражнение. Если стартовый вес слишком лёгкий, всё равно не прыгай больше чем на +10 кг за тренировку.</div><div class="box" style="margin-top:8px"><b>Как прибавлять вес (сам, без отчёта):</b> каждую следующую неделю — если в прошлый раз сделал все подходы и повторы и оставался запас 1–2 повтора → <b>+2,5 кг</b> (жимы, тяги, бицепс) или <b>+5 кг</b> (присед, становая, румынская). Гантели — на шаг тяжелее. Не сделал все повторы → вес оставить. Стартовый вес слишком лёгкий (запас больше 4 повторов) → уже в следующем подходе +5–10 кг.</div><p class="tips">Без отказа и без натуживания. Техника есть, но связки отвыкли: никаких проверок максимума до декабря. Боль в локте/плече/колене — вес не поднимаем. Печёт лёжа → жим гантелей на наклонной вместо жима лёжа.</p></div>`;

  const lifts=g?W[d.gym].filter(e=>!/Кардио|Подъём коленей/.test(e[0])).map(e=>e[0].replace(/ \(.*\)/,"")+": ___ кг × ___").join("\n"):"";
  const msgs=[
    ["🌅 Утро","08:10","Вес: ___ кг",""],
    ["🌙 Вечер","22:05","Стул: тип ___ (1–7), ___ раз\nЭнергия: ___/10\nГолод / тяга к сладкому: ___\nИзжога: ___/10\n"+(g?"Зал: легко / нормально / тяжело / что-то болело\n":"")+"Еда: всё по меню на сайте, граммы по весам — да / нет\nЕсли нет — что и сколько грамм съел вместо / сверху: ___\nВода: ___ л\nШаги: ___","Стул: 1–2 твёрдый · 3–4 норма · 5 мягкие кусочки · 6–7 кашица/вода"],
    ...(d.k==="Вс"?[["📊 Итоги недели","22:05","Скрин весов за неделю\nТренировок: ___ из 3\nЧто было тяжело: ___","Раз в 2 недели в понедельник утром — замеры талии, ягодиц, груди: 26.10, 09.11, 23.11, 07.12. Фото фас/бок/спина: 09.11, 07.12."]]:[]),
  ];
  h+=`<div class="sec"><h3>${N()} Что написать коучу</h3><div class="msgs">${msgs.map(m=>`<div class="msg"><div class="h"><b>${m[0]} <em>${m[1]}</em></b><button onclick="cp(this)">Скопировать</button></div><pre>${m[2]}</pre>${m[3]?`<div class="note">${m[3]}</div>`:""}</div>`).join("")}</div></div>`;

  if(d.prep) h+=`<div class="sec"><div class="box">${d.prep}</div></div>`;

  h+=`<div class="sec"><h3>${N()} Правила дня</h3><div class="rules">
    <span>💧 Вода 3–3,5 л</span><span>🧂 Соль +1 ч. л.</span><span>👣 8–10 тыс. шагов</span>
    <span>🚫 Хлеб, сахар, крупы, картошка</span><span>🚫 Сок, спрайт, обычная кола — ноль</span><span>🥤 Кола Zero — максимум стакан</span><span>🔥 Ничего жареного</span>
    <span>⏰ Еда за 3 ч до сна</span><span>☕ Кофе после завтрака, до 15:00</span></div></div>
  </section>`;
  box.insertAdjacentHTML("beforeend",h);

  const b=document.createElement("button"); b.className=g?"g":"";
  b.innerHTML=`${d.k}<small>${g?"зал "+d.gym:"отдых"}</small>`; b.onclick=()=>show(i); tabs.appendChild(b);
});

let cur=0;
function show(i){
  cur=i;
  document.querySelectorAll(".day").forEach((s,j)=>s.classList.toggle("on",j===i));
  [...tabs.children].forEach((b,j)=>b.classList.toggle("on",j===i));
}
show((new Date().getDay()+6)%7);
function cp(b){const t=b.closest('.msg').querySelector('pre').innerText;try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Скопировано ✓';setTimeout(()=>b.textContent='Скопировать',1500)})}catch(e){}}
function printOne(){
  const st=document.createElement("style");
  st.textContent=`@media print{.day{display:none!important}#d${cur}{display:block!important}}`;
  document.head.appendChild(st); window.print(); setTimeout(()=>st.remove(),800);
}
