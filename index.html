<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Мой план</title>
<style>
:root{
  --bg:#ffffff;--ink:#11131a;--muted:#6b7280;--line:#e8ebf1;--soft:#f6f7fb;
  --gym:#2f5bea;--gym-bg:#edf2ff;--rest:#139466;--rest-bg:#e7f7ef;
  --food:#d9730d;--food-bg:#fff4e8;--pill:#7c3aed;--pill-bg:#f3edff;
  --ev:#b7791f;--ev-bg:#fff7e0;--warn:#c0362c;--warn-bg:#fdeeec;--msg:#fff8db;
  --shadow:0 1px 2px rgba(17,19,26,.04),0 4px 14px rgba(17,19,26,.06);
  --r:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 48px}
button{font:inherit;color:inherit}
a{color:var(--gym)}

/* меню */
.nav{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:10px 16px}
.nav .in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--soft);padding:4px;border-radius:14px}
.nav button{border:0;background:transparent;border-radius:11px;padding:9px 4px;font-weight:700;cursor:pointer;font-size:14px;color:var(--muted)}
.nav button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}

/* навигация по дням */
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dnav button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px}
.dnav .today{margin-left:auto;background:var(--ink);color:#fff;border-color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.strip button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 0 7px;cursor:pointer;line-height:1.15;position:relative}
.strip button b{display:block;font-size:17px;margin:2px 0}
.strip button small{font-size:11px;color:var(--muted);font-weight:600}
.strip button.g{background:var(--gym-bg);border-color:#d6e0ff}
.strip button.g .t{color:var(--gym)}
.strip button.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.strip button.sel small{color:#c9ced8}
.strip button.now:not(.sel){box-shadow:0 0 0 2px var(--gym) inset}
.strip button.ev::after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ev)}

/* шапка дня */
.hero{border-radius:22px;padding:20px 20px 18px;color:#fff;margin-bottom:12px;background:linear-gradient(135deg,#2f5bea,#6a3df0);box-shadow:0 8px 24px rgba(47,91,234,.25)}
.hero.rest{background:linear-gradient(135deg,#119b6a,#0e8a99);box-shadow:0 8px 24px rgba(17,155,106,.22)}
.hero.pre{background:linear-gradient(135deg,#f08c2e,#e2557a);box-shadow:0 8px 24px rgba(226,85,122,.22)}
.hero .top{font-size:13px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.hero h2{margin:4px 0 10px;font-size:30px;line-height:1.1;font-weight:800}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px}
.hero .chips span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.prog{margin-top:14px}
.prog .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;background:#fff;border-radius:99px}
.prog .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;opacity:.9;margin-top:6px}

/* плитки */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow)}
.tile .ic{font-size:20px}
.tile b{display:block;font-size:16px;margin-top:2px}
.tile small{color:var(--muted);font-size:12px;font-weight:600}

/* события */
.evs{display:grid;gap:8px;margin-bottom:16px}
.evc{display:flex;gap:12px;align-items:flex-start;border:1px solid #f2dfa6;background:var(--ev-bg);border-radius:var(--r);padding:12px 14px}
.evc .e{font-size:24px;line-height:1}
.evc b{display:block;margin-bottom:2px}
.evc span{font-size:14px;color:#5c4a1c}

/* секции */
.sec{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sh .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:var(--soft)}
.sh h3{margin:0;font-size:17px;font-weight:800}
.sh .cnt{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);background:var(--soft);padding:3px 10px;border-radius:99px}
.sh .cnt.done{background:var(--rest-bg);color:var(--rest)}

/* таймлайн */
.tl{position:relative}
.tl::before{content:"";position:absolute;left:61px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tr{display:grid;grid-template-columns:50px 24px 1fr 28px;gap:0 10px;align-items:center;padding:7px 0;position:relative;cursor:pointer}
.tr .t{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;text-align:right;color:var(--muted)}
.tr .dot{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;z-index:1}
.tr .x{font-size:14.5px}
.tr .x i{font-style:normal;margin-right:4px}
.tr .ck{width:22px;height:22px;border-radius:7px;border:2px solid #c8cdd6;justify-self:end;display:grid;place-items:center;font-size:13px;color:#fff;font-weight:900}
.tr.gym .x{background:var(--gym-bg);color:var(--gym);font-weight:800;padding:6px 10px;border-radius:10px}
.tr.gym .dot{border-color:var(--gym);background:var(--gym)}
.tr.walk .dot{border-color:var(--rest)}
.tr.msg .x{background:var(--msg);font-weight:800;padding:6px 10px;border-radius:10px}
.tr.msg .dot{border-color:#e4b100}
.tr.ev .x{background:var(--ev-bg);font-weight:800;padding:6px 10px;border-radius:10px}
.tr.ev .dot{border-color:var(--ev)}
.tr.done .x{opacity:.45;text-decoration:line-through}
.tr.done .ck{background:var(--rest);border-color:var(--rest)}
.tr.done .ck::after{content:"✓"}

/* еда */
.meals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.meal{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#fff;position:relative;overflow:hidden}
.meal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--food)}
.meal .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.meal .h span{font-weight:800}
.meal .h em{font-style:normal;font-size:12px;color:var(--food);font-weight:800;background:var(--food-bg);padding:2px 8px;border-radius:99px}
.meal ul{margin:0;padding-left:18px}.meal li{margin:3px 0;font-size:14.5px}
.meal.opt{background:var(--soft)}.meal.opt::before{background:#c8cdd6}
.drink{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.drink span{font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px}
.drink .ok{background:var(--rest-bg);color:var(--rest)}
.drink .no{background:var(--warn-bg);color:var(--warn)}

/* добавки */
.sup{display:grid;gap:8px}
.su{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.su .t{font-weight:800;font-size:14px}
.su .t small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.su .p{display:flex;flex-wrap:wrap;gap:6px}
.su .p span{background:var(--pill-bg);color:var(--pill);font-weight:700;font-size:13.5px;padding:4px 10px;border-radius:99px}
.su .p em{font-style:normal;color:var(--muted);font-size:13px;align-self:center}

/* тренировка */
.phase{display:flex;gap:10px;align-items:center;background:var(--gym-bg);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.phase b{color:var(--gym)}
.ex{display:grid;gap:8px}
.exr{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.exr .no{width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--muted)}
.exr .nm{font-weight:700;font-size:14.5px;line-height:1.3}
.exr .nm small{display:block;color:var(--muted);font-weight:600;font-size:12.5px;margin-top:2px}
.exr .wt{background:var(--gym);color:#fff;font-weight:800;border-radius:12px;padding:7px 12px;font-size:15px;white-space:nowrap;text-align:center}
.exr.cardio .wt{background:var(--rest)}
.warm{font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* сообщения */
.msgs{display:grid;gap:10px}
.mc{border:1px solid #f1e3a6;background:var(--msg);border-radius:var(--r);padding:12px 14px}
.mc .h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mc .h b{font-size:15px}
.mc .h em{font-style:normal;color:var(--food);font-weight:800;margin-left:6px}
.mc pre{margin:0;white-space:pre-wrap;font:14px/1.6 ui-monospace,Consolas,monospace;background:rgba(255,255,255,.6);border-radius:10px;padding:8px 10px}
.mc button{border:0;background:var(--ink);color:#fff;border-radius:9px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}

/* общие */
.box{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--soft);font-size:14px;margin-top:10px}
.box.red{background:var(--warn-bg);border-color:#f6c9c3}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.rules{display:flex;flex-wrap:wrap;gap:6px}
.rules span{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px;background:#fff}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:800;border-top:0;background:var(--soft)}
td.s{white-space:nowrap}
.scroll{overflow-x:auto}.scroll table{min-width:640px}
tr.cur td{background:var(--gym-bg);font-weight:800}
td.cw{background:var(--gym-bg);font-weight:800;color:var(--gym)}
h4{margin:18px 0 8px;font-size:16px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#fff;box-shadow:var(--shadow)}
.card h4{margin:0 0 6px}
.card ul{margin:0;padding-left:18px}
.yes h4{color:var(--rest)}.no h4{color:var(--warn)}
.tools{display:flex;gap:8px;justify-content:flex-end;margin:0 0 12px}
.tools button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700}

.rc{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.rc summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--food);list-style:none}
.rc summary::-webkit-details-marker{display:none}
.rc summary span{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:1px}
.rc ol{margin:8px 0 4px;padding-left:20px;font-size:14px}.rc li{margin:3px 0}
.rc p{margin:4px 0 0;font-size:13px;color:#7a5a2c;background:var(--food-bg);border-radius:10px;padding:6px 9px}
.rcall{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rcall .rc{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0;background:#fff}
@media (max-width:640px){.rcall{grid-template-columns:1fr}}
@media print{.rc{display:none}}
/* календарь */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:600}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.month{margin-bottom:20px}
.month h3{margin:0 0 8px;font-size:18px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:800}
.cal button{border:1px solid var(--line);background:#fff;border-radius:12px;min-height:58px;padding:5px 6px;cursor:pointer;text-align:left;font-size:11.5px;line-height:1.15;position:relative}
.cal button b{font-size:15px;display:block}
.cal button.g{background:var(--gym-bg);border-color:#d6e0ff}
.cal button.g small{color:var(--gym);font-weight:800}
.cal button.out{opacity:.4}
.cal button.now{box-shadow:0 0 0 2px var(--ink) inset}
.cal .blank{min-height:58px}

#print{display:none}
@media (max-width:640px){
  .meals,.grid2{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .hero h2{font-size:25px}
  .sec{padding:14px 12px;border-radius:18px}
  .tl::before{left:53px}
  .tr{grid-template-columns:42px 24px 1fr 24px;gap:0 8px}
  .su{grid-template-columns:64px 1fr}
  th,td{padding:7px 6px}
  .cal button{min-height:50px;font-size:10px;padding:4px}.cal button b{font-size:13px}
  .strip button b{font-size:15px}
}
@media print{
  @page{size:A4;margin:9mm}
  body{font-size:11px}
  .nav,.pv{display:none!important}
  #print{display:block}
  .wrap{padding:0;max-width:none}
  .mc button,.tools,.dnav,.strip{display:none}
  #print .pday{break-after:page;page-break-after:always}
  #print .pday:last-child{break-after:auto;page-break-after:auto}
  .sec{box-shadow:none;padding:8px 10px;margin-bottom:6px;break-inside:avoid}
  .hero{box-shadow:none;padding:10px 14px}.hero h2{font-size:20px}
  .tiles{display:none}
  .tr{padding:2px 0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

  h+=sec("🍽","#fff4e8","Еда","",(party?`<div class="box" style="margin:0 0 10px">Вечером праздник: завтрак и обед — по меню, ужин — шашлык и овощи в гостях.</div>`:"")+`<div class="meals">
    ${meal("🍳 Завтрак","08:45",m.b,0,MR[w].b)}${meal("🍗 Обед","13:00",m.l,0,MR[w].l)}
    ${g?meal("🥣 Перекус","16:00",m.s):meal("🥚 Перекус — по желанию","16:00",["Протеин 2 ложки или 2 варёных яйца"],true)}
    ${meal(g?"🐟 Ужин после зала":"🐟 Ужин",g?"20:15":"19:30",party?["Шашлык (свинина / курица) + овощи, без лаваша и соусов"]:m.d,0,party?[]:MR[w].d)}
  </div><div class="drink"><span class="ok">✓ вода, чай без сахара</span><span class="ok">кола Zero — max стакан</span><span class="no">✕ сок, спрайт, кола, пиво</span></div><p class="note">Мясо и рыбу взвешивать сырыми на кухонных весах. Нажми «👨‍🍳» под блюдом — откроется рецепт.</p>`);

  h+=sec("💊","#f3edff","Добавки","",`<div class="sup">${supps(d).map(r=>`<div class="su"><div class="t">${r[0]}<small>${r[1]}</small></div><div class="p">${r[2].map(x=>`<span>${x}</span>`).join("")}${r[3]?`<em>${r[3]}</em>`:""}</div></div>`).join("")}</div>`);

  if(g){
    const wi=Math.min(8,Math.max(1,wk))-1;
    h+=sec("🏋️","#edf2ff","Тренировка "+g,`<span class="cnt">неделя ${wi+1}</span>`,`<div class="phase">⚡<div><b>${PHASE[wi]}</b></div></div>
    <div class="ex">${W[g].map((e,j)=>{const c=/Кардио/.test(e[0]);return `<div class="exr${c?" cardio":""}"><div class="no">${j+1}</div><div class="nm">${e[0]}<small>${c?e[2]:e[1]+" · отдых "+e[2]}</small></div><div class="wt">${kg(P[g][j][wi])}</div></div>`}).join("")}</div>
    <p class="warm"><b>Разминка 8–10 мин стоя:</b> 5 мин эллипс или велосипед → махи ногами, вращения плеч и таза, 10 приседаний без веса → 1–2 лёгких подхода с пустым грифом.</p>
    ${wi===0?`<div class="box red"><b>⚠️ Первая неделя:</b> вес — потолок, а не цель. В первом рабочем подходе запас меньше 3 повторов → сразу −10–20 %. Хрустит или тянет в суставе — снизь или пропусти.</div>`:`<div class="box">Если на прошлой неделе <b>не сделал все повторы</b> — бери вес прошлой недели (вкладка «Программа»).</div>`}
    <p class="note">Без отказа и натуживания. Боль или давление в груди при нагрузке — стоп, к врачу. Печёт лёжа — жим гантелей на наклонной вместо жима лёжа.</p>`);
  }

  const ev=`Стул: тип ___ (1–7), ___ раз\nЭнергия: ___/10\nГолод / тяга: ___\nИзжога: ___/10\n${g?"Зал: легко / нормально / тяжело / болело\n":""}Еда по меню — да / нет. Если нет — что и сколько грамм: ___\nВода: ___ л\nШаги: ___${w===6?"\n\nНеделя: скрин весов · тренировок ___ из 3 · что было тяжело: ___":""}`;
  h+=sec("📩","#fff8db","Что написать коучу","",`<div class="msgs">
   <div class="mc"><div class="h"><b>🌅 Утро<em>08:10</em></b><button onclick="cp(this)">Скопировать</button></div><pre>Вес: ___ кг${MEAS[k]?"\nТалия: ___ · Ягодицы: ___ · Грудь: ___":""}${PHOTO[k]?"\n+ 3 фото":""}</pre></div>
   <div class="mc"><div class="h"><b>🌙 Вечер<em>22:05</em></b><button onclick="cp(this)">Скопировать</button></div><pre>${ev}</pre><p class="note">Стул: 1–2 твёрдый · 3–4 норма · 5 мягкие кусочки · 6–7 кашица/вода</p></div>
  </div>`);
  return h;
}
function preStartHTML(d){
  const k=key(d), left=Math.round((START-day0(d))/864e5);
  let h=heroHTML(d,"pre","До старта программы",[`⏳ Старт через ${left} дн.`,"🚀 Понедельник, 12 октября"],null);
  h+=evHTML(k);
  const rows=[["","⚖️","Утром взвеситься и написать вес коучу — привыкаем"],["","🛒","Докупить: белокочанная капуста, кабачки, огурцы, зелень, оливковое масло, бульонные кубики без сахара"],["","🍺","Пиво из дома убрать до вечера воскресенья"],["","🥘","Воскресенье днём: запечь курицу, сварить яйца, форель — в холодильник"],["","⏰","Будильники: 08:10 «вес коучу» и 22:05 «вечерний отчёт»"],["","🏋️","Собрать сумку в зал на понедельник"]];
  const t=tlHTML(rows,"prestart");
  h+=sec("✅","#fff4e8","Подготовка к старту",t[0],t[1]);
  h+=`<div class="box">Понедельник 12 октября — день 1. Открой его кнопкой «день →» или в полоске дней сверху.</div>`;
  return h;
}

/* ===== ВИДЫ ===== */
const FIRST=()=>TODAY<START?START:TODAY;
let SEL=FIRST();
function renderDay(){
  const mon=addD(SEL,-wdi(SEL));
  let h=`<div class="dnav"><button onclick="go(-1)">← день</button><button onclick="go(1)">день →</button><button class="today" onclick="SEL=FIRST();renderDay()">${TODAY<START?"К старту":"Сегодня"}</button></div><div class="strip">`;
  for(let i=0;i<7;i++){const d=addD(mon,i),g=inProg(d)?GYM[i]:null;h+=`<button class="${g?"g ":""}${+d===+SEL?"sel ":""}${+d===+TODAY?"now ":""}${EV[key(d)]?"ev":""}" onclick="pick('${key(d)}')"><small>${WDS[i]}</small><b>${d.getDate()}</b><small class="t">${g?"зал "+g:(d<START?"—":"отдых")}</small></button>`;}
  h+=`</div><div class="tools"><button onclick="printDays([SEL])">🖨 Печать дня</button><button onclick="printWeek()">🖨 Печать недели</button></div>`;
  h+=dayHTML(SEL);
  document.getElementById("v-day").innerHTML=h;
}
function go(n){SEL=addD(SEL,n);if(SEL<START)SEL=START;renderDay();window.scrollTo(0,0);}
function pick(k){SEL=fromKey(k);show("day");}

function renderCal(){
  let h=`<div class="legend"><span><i style="background:var(--gym-bg);border:1px solid #c9d8fb"></i>Зал</span><span><i style="background:#fff;border:1px solid var(--line)"></i>Отдых</span><span>🎉 Событие</span><span><i style="box-shadow:0 0 0 2px var(--ink) inset"></i>Сегодня</span></div><p class="note" style="margin:-4px 0 12px">Нажми на любую дату — откроется её план.</p>`;
  [[2026,9],[2026,10],[2026,11]].forEach(([y,m])=>{
    const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
    h+=`<div class="month"><h3>${MONN[m]} ${y}</h3><div class="cal">${WDS.map(x=>`<div class="wd">${x}</div>`).join("")}`;
    for(let i=0;i<wdi(first);i++) h+=`<div class="blank"></div>`;
    for(let dd=1;dd<=days;dd++){
      const d=new Date(y,m,dd), g=GYM[wdi(d)], k=key(d), e=EV[k], ip=inProg(d);
      h+=`<button class="${g&&ip?"g ":""}${!ip?"out ":""}${+d===+TODAY?"now ":""}" ${d<START?"disabled":`onclick="pick('${k}')"`} title="${e?e[0][1]:""}"><b>${dd}</b><small>${g&&ip?"зал "+g:""}</small>${e?`<div style="margin-top:2px">${e[0][0]}</div>`:""}</button>`;
    }
    h+=`</div></div>`;
  });
  h+=`<h4>Все события</h4><table>${Object.keys(EV).map(k=>{const d=fromKey(k);return `<tr><td class="s"><a href="#${k}" onclick="pick('${k}');return false">${WDS[wdi(d)]}, ${d.getDate()} ${MON[d.getMonth()]}</a></td><td>${EV[k][0][0]} <b>${EV[k][0][1]}</b></td></tr>`}).join("")}</table>`;
  document.getElementById("v-cal").innerHTML=h;
}

function renderProg(){
  const cw=inProg(TODAY)?weekOf(TODAY):0;
  let h=`<h4 style="margin-top:0">Блок 1 · 12.10 – 06.12 · Full Body Пн / Ср / Пт в 18:30</h4><div class="scroll"><table><tr><th>#</th><th>Даты</th><th>Зал</th><th>Шаги в день</th></tr>`;
  for(let i=0;i<8;i++){const a=addD(START,i*7),b=addD(a,6);h+=`<tr class="${i+1===cw?"cur":""}"><td>${i+1}</td><td class="s">${pad(a.getDate())}.${pad(a.getMonth()+1)} – ${pad(b.getDate())}.${pad(b.getMonth()+1)}</td><td>${PHASE[i]}</td><td>${STEPS[i]}</td></tr>`;}
  h+=`</table></div>`;
  [["А","Понедельник"],["Б","Среда"],["В","Пятница"]].forEach(([k,dn])=>{
    h+=`<h4>Тренировка ${k} · ${dn}</h4><div class="scroll"><table><tr><th>Упражнение</th><th>Подходы</th>${[1,2,3,4,5,6,7,8].map(i=>`<th${i===cw?' style="color:var(--gym)"':""}>Нед ${i}</th>`).join("")}</tr>`+
      W[k].map((e,j)=>`<tr><td>${e[0]}</td><td class="s">${e[1]}</td>${P[k][j].map((v,i)=>`<td class="s${i+1===cw?" cw":""}">${v}</td>`).join("")}</tr>`).join("")+`</table></div>`;
  });
  h+=`<div class="box"><b>Как прибавлять:</b> вес следующей недели берёшь, только если на этой сделал все подходы и повторы. Не сделал — повтори вес, график сдвигается на неделю. Гантели — вес одной гантели. Больше +10 кг за тренировку не прыгать.</div>
  <h4>Дальше по месяцам</h4><table><tr><th>Когда</th><th>Цель</th><th>Что делаем</th></tr>
  <tr><td class="s">07.12 – 31.01</td><td>104–106 кг к 04.01</td><td>Блок 2 — коуч собирает 06.12 по итогам блока 1. 12.12 конец «поста» по алкоголю, Новый год — читмил</td></tr>
  <tr><td class="s">февраль – апрель</td><td>97–100 кг, талия ~100</td><td>Блоки 3–4, пересчёт калорий каждые −5 кг, гастроэнтеролог про Пантап</td></tr>
  <tr><td class="s">май – октябрь 2027</td><td>88–91 кг, талия &lt; 94</td><td>Дожимаем до ~15 % жира, затем поддержание</td></tr></table>`;
  document.getElementById("v-prog").innerHTML=h;
}

function renderRules(){
  document.getElementById("v-rules").innerHTML=`
  <h4 style="margin-top:0">Цифры на день</h4>
  <div class="rules"><span>🔥 ~2 200 ккал</span><span>🥩 Белок 170–190 г</span><span>🍞 Углеводы до 25 г</span><span>💧 Вода 3–3,5 л</span><span>🧂 Соль +1 ч. л.</span><span>👣 Шаги — по неделе</span><span>😴 Сон 23:00–08:00</span></div>
  <h4>Еда</h4><div class="grid2">
   <div class="card yes"><h4>✅ Можно</h4><ul><li>Яйца, курица, свинина, говядина</li><li>Рыба (форель, скумбрия, минтай)</li><li>Творог, сыр, сливки 20 % (30–50 мл)</li><li>Капуста, брокколи, цветная, кабачки, огурцы, зелень</li><li>Сливочное и оливковое масло</li><li>Грецкие орехи до 20–30 г</li></ul></div>
   <div class="card no"><h4>🚫 Нельзя</h4><ul><li>Хлеб, выпечка, мука</li><li>Сахар, сладкое, мёд</li><li>Крупы, картошка, макароны</li><li>Фрукты (кроме горсти ягод)</li><li>Сок, спрайт, обычная кола, пиво</li><li>⚠️ Креветки, крабы, раки — аллергия</li></ul></div>
  </div>
  <h4>Рефлюкс</h4><div class="rules"><span>Таблетка каждое утро, не пропускать</span><span>Еда за 3 ч до сна</span><span>Не жарить в масле: духовка, гриль, тушение. Антипригарная — без масла или ≤ 5 г</span><span>Газировку убрать</span><span>Сон на левом боку, изголовье выше</span></div>
  <h4>Алкоголь и читмилы</h4><table>
   <tr><td class="s"><b>12.10 – 12.12</b></td><td>Алкоголь — ноль, как в пост. Исключение — ДР 24.10 (план в календаре)</td></tr>
   <tr><td class="s"><b>с 09.11</b></td><td>Читмил по еде (пицца, суши) — не чаще раза в 2 недели, лучше в один вечер с алкогольным</td></tr>
   <tr><td class="s"><b>после 12.12</b></td><td>Алкоголь — только в компании, заранее решённый, не чаще раза в 2–3 недели. <b>Никогда одному дома под фильм</b></td></tr>
   <tr><td class="s"><b>на следующий день</b></td><td>Обычный план. Без голодовки и «наказаний»</td></tr></table>
  <h4>👨‍🍳 Все рецепты</h4><div class="rcall">${Object.keys(RC).map(k=>rcHTML([k])).join("")}</div><p class="note">Специи без ограничений: соль, паприка, сушёный чеснок, укроп, прованские травы, лавровый лист. Осторожно: острый перец, лимон, томаты (рефлюкс). Готовые соусы и кетчуп — нет (сахар).</p>

  <h4>Кето-грипп (дни 2–6)</h4><div class="box" style="margin-top:0">Слабость, голова, раздражительность — нормально. Кружка солёного бульона 1–2 раза в день, +0,5 л воды, магний, сон. Проходит к 5–7 дню.</div>
  <h4>Пропустил тренировку</h4><div class="box" style="margin-top:0">Переносишь на следующий день (не две подряд). Пропустил неделю — веса −10 %.</div>
  <h4>Стоп и к врачу</h4><div class="box red" style="margin-top:0">Боль или давление за грудиной при нагрузке, отдаёт в руку или челюсть · одышка не по нагрузке · обморок · кровь или чёрный стул · еда застревает при глотании.</div>`;
}

/* ===== ПЕЧАТЬ ===== */
function printDays(arr){
  document.getElementById("print").innerHTML=arr.map(d=>`<div class="pday">${d<START?preStartHTML(d):dayHTML(d)}</div>`).join("");
  window.print();
}
function printWeek(){const mon=addD(SEL,-wdi(SEL));printDays([0,1,2,3,4,5,6].map(i=>addD(mon,i)));}
function cp(b){const t=b.closest('.mc').querySelector('pre').innerText;try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Скопировано ✓';setTimeout(()=>b.textContent='Скопировать',1500)})}catch(e){}}

/* ===== ПЕРЕКЛЮЧЕНИЕ ===== */
const R={day:renderDay,cal:renderCal,prog:renderProg,rules:renderRules};
function show(v){
  document.querySelectorAll(".pv").forEach(x=>x.style.display="none");
  document.getElementById("v-"+v).style.display="block";
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  R[v](); window.scrollTo(0,0);
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
try{if(location.hash)history.replaceState(null,"",location.pathname+location.search)}catch(e){}
show("day");
</script>
